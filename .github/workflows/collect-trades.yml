name: 실거래가 수집

# 분양예정가 추정에 "주변 시세"를 넣기 위한 국토부 아파트 매매 실거래가 수집.
#
# 처음 한 번은 시군구 코드표를 훑느라 20분쯤 걸립니다. 코드표는
# data/lawd.json 으로 커밋되므로 그 다음부터는 거래만 받습니다(몇 분).

on:
  workflow_dispatch:
    inputs:
      months_back:
        description: "공고 시점에서 몇 개월 뒤까지 볼지"
        default: "6"
      concurrency:
        description: "동시 요청 수 (너무 높이면 거부당합니다)"
        default: "5"
      probe_only:
        description: "한도 진단만 하고 수집은 건너뛰기 (true/false)"
        default: "false"
      scan_budget:
        description: "코드표 훑기에 쓸 하루 호출 수 (한도 10,000 중)"
        default: "8000"
  schedule:
    # 매일 00:10 KST — 공공데이터포털 일일 한도가 자정에 풀립니다.
    # 코드표가 다 차기 전에는 훑기를 이어서 하고, 완성되면 거래만 받습니다.
    - cron: "10 15 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 인증키 확인
        env:
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
        run: |
          if [ -z "$ODCLOUD_KEY" ]; then
            echo "::error::ODCLOUD_KEY 시크릿이 없습니다"
            exit 1
          fi
          echo "인증키 길이 ${#ODCLOUD_KEY}자"

      - name: 한도 진단
        env:
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
        run: node scripts/probe-quota.js

      - name: 실거래가 수집
        if: inputs.probe_only != 'true'
        env:
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
          MONTHS_BACK: ${{ inputs.months_back || '6' }}
          CONCURRENCY: ${{ inputs.concurrency || '5' }}
          SCAN_BUDGET: ${{ inputs.scan_budget || '8000' }}
        run: node scripts/collect-trades.js

      - name: 커밋
        if: inputs.probe_only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lawd.json data/trades.json
          if git diff --staged --quiet; then
            echo "바뀐 게 없습니다"
          else
            git commit -m "chore(data): 실거래가 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
            # 도는 동안 main 이 앞서갈 수 있습니다 — 받아서 얹고 밀어 봅니다
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "푸시 재시도 $i"
              sleep $((i * 5))
            done
            echo "::error::푸시 실패 — 수집 결과는 아티팩트에 있습니다"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trades-${{ github.run_number }}
          path: |
            data/lawd.json
            data/trades.json
            data/probe-quota.json
          if-no-files-found: warn
